# /etc/nginx/snippets/avtostil-headers.conf — заголовки безопасности сайта; подключается в server и в каждом location со своими add_header
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
# CSP сайта: шрифты Google, Яндекс.Карты на контактах, Метрика. Добавляйте домены, если подключаете новые сервисы.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://api-maps.yandex.ru https://*.yandex.ru https://*.yandex.net https://mc.yandex.ru https://smartcaptcha.yandexcloud.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.yandex.ru https://*.yandex.net https://*.maps.yandex.net https://mc.yandex.ru; connect-src 'self' https://*.yandex.ru https://*.yandex.net https://mc.yandex.ru; frame-src https://*.yandex.ru https://smartcaptcha.yandexcloud.net; form-action 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'" always;
