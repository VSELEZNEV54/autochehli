# nginx для 1avtochehol.ru: сайт (статика) + бэкенд (/api/, /admin/) + защита от перегрузки.
# Положить в /etc/nginx/sites-available/avtostil.conf, сделать ссылку в sites-enabled, nginx -t && systemctl reload nginx.
# Сертификат: certbot --nginx -d 1avtochehol.ru -d www.1avtochehol.ru
#
# Защита от DDoS на уровне приложения ограничена: nginx режет частые запросы с одного IP, но объёмную атаку
# (сотни тысяч IP, гигабиты трафика) останавливает только внешний фильтр перед сервером — DDoS-Guard, Qrator,
# Yandex Cloud Smart Web Security, Servicepipe или Cloudflare. См. DEPLOY.md.

# --- зоны лимитов (в http{}; если файл подключается внутри http — оставить здесь) ---
limit_req_zone $binary_remote_addr zone=site:20m    rate=30r/s;   # страницы и статика
limit_req_zone $binary_remote_addr zone=api:10m     rate=5r/s;    # VIN, статус заказа
limit_req_zone $binary_remote_addr zone=forms:10m   rate=10r/m;   # заказы и заявки
limit_req_zone $binary_remote_addr zone=login:10m   rate=5r/m;    # вход в админку
limit_conn_zone $binary_remote_addr zone=perip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream avtostil_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name 1avtochehol.ru www.1avtochehol.ru;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://1avtochehol.ru$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.1avtochehol.ru;
    ssl_certificate     /etc/letsencrypt/live/1avtochehol.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1avtochehol.ru/privkey.pem;
    return 301 https://1avtochehol.ru$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 1avtochehol.ru;

    ssl_certificate     /etc/letsencrypt/live/1avtochehol.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/1avtochehol.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/avtostil;      # только опубликованный сайт (deploy/publish.sh), без backend/, tools/, content/
    index index.html;
    charset utf-8;
    server_tokens off;

    # медленные клиенты и большие тела — частый способ положить сервер
    client_max_body_size 64k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 30s;
    send_timeout 15s;
    limit_conn perip 40;

    # заголовки безопасности — в сниппете: nginx не наследует add_header сервера в location со своими add_header
    include /etc/nginx/snippets/avtostil-headers.conf;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
    gzip_min_length 1024;

    # служебное никогда не отдаём, даже если случайно попало в корень
    location ~ /\.(?!well-known) { deny all; return 404; }
    location ~* ^/(backend|tools|content|partials|план|кп|каталог)(/|$) { deny all; return 404; }
    location ~* \.(py|md|sh|env|ini|db|sqlite|sqlite3|bak|log|json\.bak)$ { deny all; return 404; }

    # --- бэкенд ---
    location = /api/payments/yookassa/webhook {
        # уведомления ЮKassa: свой лимит, адреса ЮKassa проверяет приложение
        limit_req zone=api burst=50 nodelay;
        include /etc/nginx/snippets/avtostil-proxy.conf;
    }
    location ~ ^/api/(orders|requests)$ {
        limit_req zone=forms burst=5 nodelay;
        include /etc/nginx/snippets/avtostil-proxy.conf;
    }
    location /api/ {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/snippets/avtostil-proxy.conf;
    }
    location = /admin/login {
        limit_req zone=login burst=3 nodelay;
        # allow 203.0.113.10; deny all;   # админка только из офиса — раскомментировать и вписать IP
        include /etc/nginx/snippets/avtostil-proxy.conf;
    }
    location /admin/ {
        # allow 203.0.113.10; deny all;
        limit_req zone=api burst=40 nodelay;
        include /etc/nginx/snippets/avtostil-proxy.conf;
    }
    location = /admin { return 301 /admin/; }

    # --- сайт ---
    location ~* \.(css|js|svg|png|jpg|jpeg|webp|avif|woff2?|ico)$ {
        limit_req zone=site burst=200 nodelay;
        expires 30d;                       # в ссылках ?v=N — после выкладки браузеры возьмут новое
        add_header Cache-Control "public" always;
        include /etc/nginx/snippets/avtostil-headers.conf;
        access_log off;
        try_files $uri =404;
    }
    location / {
        limit_req zone=site burst=60 nodelay;
        # страницы — всегда с проверкой свежести: после выкладки браузер берёт новый HTML с новыми ?v=N
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/avtostil-headers.conf;
        try_files $uri $uri.html $uri/ =404;
    }
    error_page 429 /429.html;
    location = /429.html { internal; default_type text/html; return 429 '<!doctype html><meta charset="utf-8"><title>Слишком много запросов</title><p style="font:16px sans-serif;padding:40px">Слишком много запросов. Подождите минуту или позвоните 8 (800) 775-32-60.</p>'; }
}

# Сниппеты: deploy/avtostil-proxy.conf и deploy/avtostil-headers.conf → /etc/nginx/snippets/
