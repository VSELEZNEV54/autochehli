# /etc/nginx/snippets/avtostil-proxy.conf — подключается в location /api/ и /admin/
proxy_pass http://avtostil_backend;
proxy_http_version 1.1;
proxy_set_header Connection "";
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_connect_timeout 5s;
proxy_send_timeout 15s;
proxy_read_timeout 30s;
# общие заголовки безопасности ставит nginx (avtostil-headers.conf) — убираем дубли от приложения;
# Content-Security-Policy приложения (строже у /admin) остаётся и действует вместе с политикой сайта
proxy_hide_header X-Frame-Options;
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Permissions-Policy;
